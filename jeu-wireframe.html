<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Reine des Micro-organismes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#272727',
                        secondary: '#F8F7F1',
                        bacteria: '#423567',
                        'pillar-1': '#8BDFE7',
                        'pillar-2': '#8DC947',
                        'pillar-3': '#FFD04C',
                        'pillar-4': '#FFA1C8',
                        'pillar-5': '#FF6459',
                    },
                    fontFamily: {
                        'staatliches': ['Staatliches', 'cursive'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'poppins': ['poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700&family=Staatliches&display=swap"
        rel="stylesheet">
    <style>
        /* Variables CSS personnalisées */
        :root {
            --pillar-1-color: #8BDFE7;
            --pillar-2-color: #8DC947;
            --pillar-3-color: #FFD04C;
            --pillar-4-color: #FFA1C8;
            --pillar-5-color: #FF6459;
            --bg-color: #F8F7F1;
            --primary-color: #272727;
            --bcteria-color: #423567;
            --error-color: #FF6459;
            --success-color: #21AA74;

        }

        /* Animations */

        /* Background image disabled - using solid color instead
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("background-uxd2.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.3;
            z-index: -1;
        }
        */

        /* Classes dynamiques pour JavaScript */
        .active {
            display: block !important;
        }

        #diceAnimation.active {
            display: flex !important;
        }

        #pillarsSelection.active {
            display: grid !important;
        }

        #playerSetup.active {
            display: flex !important;
        }

        /* Progress box colors (appliquées dynamiquement) */
        .pillar-1 {
            background-color: var(--pillar-1-color) !important;
        }

        .pillar-2 {
            background-color: var(--pillar-2-color) !important;
        }

        .pillar-3 {
            background-color: var(--pillar-3-color) !important;
        }

        .pillar-4 {
            background-color: var(--pillar-4-color) !important;
        }

        .pillar-5 {
            background-color: var(--pillar-5-color) !important;
        }

        /* Key Loss Animation */
        @keyframes keyLossPopup {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }

            20% {
                transform: translate(-50%, -50%) scale(1);
            }

            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        #keyLossNotification.show {
            display: block !important;
            animation: keyLossPopup 2.5s ease-in-out;
        }

        /* Progress bar key removal animation */
        @keyframes keyRemoval {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        .key-removing {
            animation: keyRemoval 0.5s ease-out forwards;
        }

        /* Event modal backgrounds (appliquées dynamiquement) */
        #eventScreen.security #eventContainer {
            background-color: var(--event-security-bg) !important;
        }

        #eventScreen.incident #eventContainer {
            background-color: var(--event-incident-bg) !important;
        }

        #eventScreen.surprise #eventContainer {
            background-color: var(--event-surprise-bg) !important;
        }

        /* Answer states (appliquées dynamiquement par JS) */
        .answer-option {
            background: #FFFFFF;
            border: 3px solid #D1D5DB;
            padding: 16px 20px;
            cursor: pointer;
            text-align: left;
            font-family: 'poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            color: #000;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .answer-option:hover {
            background: #F9FAFB;
            border-color: #9CA3AF;
        }

        .answer-option.correct {
            /* Couleur appliquée dynamiquement par JS */
        }

        .answer-option.correct::after {
            content: '✓';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            color: secondary;
            font-weight: bold;
        }

        .answer-option.incorrect {
            /* Styles appliqués dynamiquement par JS */
        }

        /* Utility classes */
        .highlight {
            font-weight: 700;
        }

        .danger {
            font-weight: 700;
        }
    </style>
</head>

<body class="font-sans p-8 bg-secondary text-primary min-h-screen relative">

    <!-- Header with Settings & Mode -->
    <div class="fixed top-4 left-0 w-full px-4 z-[100] flex justify-between items-center pointer-events-none">
        <div class="w-12 h-12"></div> <!-- Spacer -->
        <div class="flex-1 flex justify-center">
            <div class="bg-secondary/50 px-4 py-1 rounded-full backdrop-blur-sm pointer-events-auto">
                <span id="gameModeDisplay"
                    class="text-[10px] font-bold text-primary uppercase tracking-[0.2em] leading-none">
                    CHARGEMENT...
                </span>
            </div>
        </div>
        <div class="pointer-events-auto">
            <button onclick="toggleSettingsModal()"
                class="w-12 h-12 flex items-center justify-center bg-secondary/80 rounded-full border-2 border-primary hover:bg-secondary transition-colors shadow-sm">
                <span class="material-icons text-primary">settings</span>
            </button>
        </div>

    <!-- Main content -->
    <div class="w-full max-w-sm mx-auto relative z-10 flex flex-col gap-4">

        <!-- Logo OMS-->
        <div class="mt-6">
            <img src="logo-uxd2.png" alt="Logo OMS" class="mx-auto h-[12rem]">
        </div>

        <!-- Player info card -->
        <div class="bg-secondary rounded-xl border-2 border-primary p-4 flex flex-col gap-3">
            <div class="flex flex-col gap-1">
                <span class="font-staatliches text-2xl text-primary uppercase" id="currentPlayerName">Nom du
                    joueur</span>
                <span class="font-poppins">C’est à vous de jouer !</span>
            </div>

            <!-- Progress bar -->
            <div class="flex items-center gap-2">
                <div class="flex gap-1 flex-1" id="progressBoxes">
                    <div class="flex-1 h-5 rounded bg-gray-300 rounded-tl-[20px] rounded-bl-[20px]"></div>
                    <div class="flex-1 h-5 rounded bg-gray-300"></div>
                    <div class="flex-1 h-5 rounded bg-gray-300"></div>
                    <div class="flex-1 h-5 rounded bg-gray-300"></div>
                    <div class="flex-1 h-5 rounded bg-gray-300 rounded-tr-[20px] rounded-br-[20px]"></div>
                </div>
                <div class="text-xs font-bold text-primary secondaryspace-nowrap" id="keysProgress">0/5 CLÉS</div>
            </div>

            <!-- Quiz section -->
            <div class="p-4 text-center rounded-xl cursor-pointer transition-all hover:opacity-90 hover:-translate-y-0.5"
                style="background: linear-gradient(110deg, #8BDFE7, #8DC947, #FFD04C, #FFA1C8, #FF6459);"
                onclick="window.location.href='pillar-selection.html'">
                <div
                    class="text-3xl font-bold text-secondary m-0 flex items-center justify-center gap-4 tracking-[2px]">
                    QUIZ OMS <img src="cles-oms.png" alt="cle-btn" class="w-16"></div>
            </div>
        </div>


        <!-- Chance and Malchance cards -->
        <div class="bg-[#2C2C2C] rounded-2xl p-4 flex gap-3">
            <!-- Case Chance -->
            <button
                class="flex-1 w-1/2 bg-secondary rounded-2xl p-6 cursor-pointer transition-all hover:opacity-90 hover:-translate-y-1 flex flex-col items-center justify-center gap-3 border-2 border-secondary"
                onclick="drawCard('chance')">
                <img src="expert.svg" alt="expert" class="w-16 h-16">
                <div class="text-base font-bold text-primary font-poppins leading-tight text-center">Case<br>chance
                </div>
            </button>

            <!-- Case Malchance -->
            <button
                class="flex-1 w-1/2 bg-bacteria rounded-2xl p-6 cursor-pointer transition-all hover:opacity-90 hover:-translate-y-1 flex flex-col items-center justify-center gap-3 border-2 border-secondary"
                onclick="drawCard('malchance')">
                <img src="bacteria.svg" alt="malchance" class="w-16 h-16">
                <div class="text-base font-bold text-secondary font-poppins leading-tight text-center">Case<br>malchance
                </div>
            </button>
        </div>

        <!-- Bouton Prochain joueur -->
        <button
            class="w-full py-3 px-5 font-poppins font-semibold bg-secondary text-primary cursor-pointer font-semibold text-base rounded-lg transition-all hover:opacity-90 border-2 border-primary"
            onclick="nextPlayer()">
            Joueur suivant
    </div>

    <!-- Modal Malchance (Fullscreen Image Only) -->
    <div class="hidden fixed inset-0 bg-primary z-[200] flex items-center justify-center cursor-pointer"
        id="malchanceScreen" onclick="closeMalchance()">
        <img id="malchanceImage" src="" alt="Malchance" class="max-w-full max-h-full object-contain">
    </div>

    <!-- Modal Chance (Fullscreen Image Only) -->
    <div class="hidden fixed inset-0 bg-primary z-[200] flex items-center justify-center cursor-pointer"
        id="chanceScreen" onclick="closeChance()">
        <img id="chanceImage" src="" alt="Chance" class="max-w-full max-h-full object-contain">
    </div>

    <!-- Final Victory Screen -->
    <div class="hidden fixed inset-0 bg-primary z-[300] flex items-center justify-center cursor-pointer"
        id="finalVictoryScreen" onclick="resetGame()">
        <img src="ecran-victoire.png" alt="Victoire Finale" class="w-full h-full object-cover">
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal"
        class="hidden fixed inset-0 bg-primary/90 backdrop-blur-md z-[400] flex items-center justify-center p-6">
        <div
            class="bg-secondary w-full max-w-xs rounded-xl border-2 border-secondary p-8 flex flex-col gap-6 relative shadow-2xl">
            <button onclick="toggleSettingsModal()"
                class="absolute top-4 right-4 text-primary hover:rotate-90 transition-transform">
                <span class="material-icons text-3xl">close</span>
            </button>
            <h2 class="font-staatliches text-3xl text-primary text-center">PARAMÈTRES</h2>

            <div class="flex flex-col gap-4">
                <button onclick="toggleSound()" id="soundToggleBtn"
                    class="bg-secondary border-2 border-primary p-4 rounded-xl flex items-center justify-between font-poppins font-bold text-primary active:scale-95 transition-transform">
                    <span>SON DU JEU</span>
                    <span class="material-icons" id="soundIcon">volume_up</span>
                </button>

                <button onclick="confirmReset()"
                    class="bg-secondary border-2 border-primary p-4 rounded-xl flex items-center justify-between font-poppins font-bold text-primary active:scale-95 transition-transform">
                    <span>RECOMMENCER</span>
                    <span class="material-icons">refresh</span>
                </button>
            </div>

            <button onclick="toggleSettingsModal()"
                class="mt-4 bg-primary text-secondary font-poppins font-bold py-3 px-8 rounded-xl active:scale-95 transition-transform uppercase">
                Fermer
            </button>
        </div>
    </div>


    <script>
        // Données du jeu (VERSION COMPLÈTE)

        // PROTECTION: Redirect to player config if no players configured
        const storedPlayers = localStorage.getItem('players');
        const storedMode = localStorage.getItem('gameMode');

        if (!storedPlayers || !storedMode) {
            // No players configured, redirect to mode selection
            window.location.href = 'mode-selection.html';
        }

        let gameData = null;
        // Audio management
        let currentAudio = null;
        // backgroundMusic is now managed by music-controller.js
        let isMusicMuted = localStorage.getItem('isMusicMuted') === 'true';

        // Game mode management
        let gameMode = 'cooperative'; // 'cooperative' or 'competitive'
        let teamKeys = []; // For cooperative mode - shared keys

        // Get game mode from URL parameters
        function getGameMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const modeParam = urlParams.get('mode');
            const storedMode = localStorage.getItem('gameMode');

            let rawMode = modeParam || storedMode || 'cooperative';

            // Normalize
            if (rawMode === 'competitive' || rawMode === 'competitif') {
                gameMode = 'competitive';
            } else {
                gameMode = 'cooperative';
            }

            // Force correct value in localStorage
            localStorage.setItem('gameMode', gameMode);

            console.log('Game mode normalized to:', gameMode);

            // Update display
            const modeDisplay = document.getElementById('gameModeDisplay');
            if (modeDisplay) {
                modeDisplay.textContent = gameMode === 'cooperative' ? 'MODE COOPÉRATIF' : 'MODE COMPÉTITIF';
            }
        }

        // Initialize game mode on page load
        getGameMode();

        // Music is now managed by music-controller.js
        // No need for local music initialization

        fetch("jeu-cartes.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erreur chargement JSON");
                }
                return response.json();
            })
            .then(data => {
                console.log("JSON chargé :", data);
                gameData = data; // variable globale
                initGame(); // Initialiser le jeu après chargement des données
            })
            .catch(error => {
                console.error("Erreur :", error);
            });

        // Fonction pour jouer un audio
        function playAudio(audioPath) {
            // Arrêter l'audio en cours s'il existe
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            // Créer et jouer le nouvel audio
            if (audioPath) {
                currentAudio = new Audio(audioPath);
                currentAudio.play().catch(error => {
                    console.error("Erreur lecture audio:", error);
                });
            }
        }

        // Fonction pour arrêter l'audio
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
        }

        // Gestion des joueurs
        let players = [];
        let currentPlayerIndex = 0;
        let playerQuestions = {};
        let playerKeys = {}; // Clés gagnées par chaque joueur

        function saveGameState() {
            localStorage.setItem('currentPlayerIndex', currentPlayerIndex);
            localStorage.setItem('playerKeys', JSON.stringify(playerKeys));
            localStorage.setItem('teamKeys', JSON.stringify(teamKeys));
        }

        function loadGameState() {
            const savedIndex = localStorage.getItem('currentPlayerIndex');
            if (savedIndex !== null) currentPlayerIndex = parseInt(savedIndex);

            const savedPlayerKeys = localStorage.getItem('playerKeys');
            if (savedPlayerKeys) playerKeys = JSON.parse(savedPlayerKeys);

            const savedTeamKeys = localStorage.getItem('teamKeys');
            if (savedTeamKeys) teamKeys = JSON.parse(savedTeamKeys);
        }

        // LOAD PLAYERS: Initialize from localStorage
        try {
            const rawPlayers = localStorage.getItem('players');
            if (rawPlayers) {
                players = JSON.parse(rawPlayers);
                console.log('Players loaded:', players);
            }
        } catch (e) {
            console.error('Error parsing players from localStorage:', e);
            window.location.href = 'mode-selection.html';
        }

        // Initialize player data structures and start game UI
        function initGame() {
            if (players.length === 0) {
                console.error('No players found, redirecting...');
                window.location.href = 'mode-selection.html';
                return;
            }

            // Initialiser les structures de données si nécessaire
            players.forEach((player) => {
                playerQuestions[player] = {};
                for (let i = 0; i < 5; i++) {
                    playerQuestions[player][i] = [];
                }
                if (!playerKeys[player]) {
                    playerKeys[player] = [];
                }
            });

            // Charger l'état sauvegardé
            loadGameState();

            // Initialize team keys for cooperative mode
            if (gameMode === 'cooperative') {
                if (!teamKeys || teamKeys.length === 0) {
                    teamKeys = [];
                }
            }

            // Hide configuration and show game
            const playerSetup = document.getElementById("playerSetup");
            if (playerSetup) playerSetup.style.display = "none";

            const gameContainer = document.getElementById("gameContainer");
            if (gameContainer) gameContainer.style.display = "block";

            // CHECK QUIZ RESULT
            const quizResultRaw = localStorage.getItem('quizResult');
            if (quizResultRaw) {
                const result = JSON.parse(quizResultRaw);
                localStorage.removeItem('quizResult'); // Clear immediately

                if (result.success) {
                    const pillarIndex = result.pillarIndex;
                    const currentPlayer = players[currentPlayerIndex];

                    if (gameMode === 'cooperative') {
                        if (!teamKeys.includes(pillarIndex)) {
                            teamKeys.push(pillarIndex);
                        }
                        if (teamKeys.length >= 5) {
                            showFinalVictory();
                        }
                    } else {
                        if (!playerKeys[currentPlayer].includes(pillarIndex)) {
                            playerKeys[currentPlayer].push(pillarIndex);
                        }
                        if (playerKeys[currentPlayer].length >= 5) {
                            showFinalVictory();
                        }
                    }

                    saveGameState(); // Sauvegarder après gain de clé

                    // Show some visual feedback or message?
                    console.log(`Félicitations ! Clé du pilier ${pillarIndex + 1} obtenue.`);

                    // Move to next player after a success (only if not victory)
                    if (!(gameMode === 'cooperative' && teamKeys.length >= 5) &&
                        !(gameMode === 'competitive' && playerKeys[currentPlayer].length >= 5)) {
                        nextPlayer();
                    }
                }
            }

            updatePlayerDisplay();

            // Music is automatically started by music-controller.js
        }

        // Update player display
        function updatePlayerDisplay() {
            if (players.length > 0) {
                const currentPlayer = players[currentPlayerIndex];
                const playerNameSpan = document.querySelector("#currentPlayerName");
                if (playerNameSpan) {
                    playerNameSpan.textContent = currentPlayer;
                }
                // Mettre à jour la barre de progression avec les clés du joueur actuel
                updatePlayerProgressBar();
            }
        }

        // Fonction pour passer au joueur suivant
        function nextPlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            saveGameState(); // Sauvegarder l'index du nouveau joueur
            updatePlayerDisplay();
        }

        // Track completed pillars
        let completedPillars = [];

        // Update progress bar
        function updateProgress() {
            const progressBoxes = document.querySelectorAll('.progress-box');
            const progressText = document.querySelector('.progress-text');

            completedPillars.forEach((pillarIndex, index) => {
                if (progressBoxes[index]) {
                    progressBoxes[index].classList.remove('empty');
                    progressBoxes[index].classList.add(`pillar-${pillarIndex + 1}`);
                }
            });

            if (progressText) {
                progressText.textContent = `${completedPillars.length}/5 CLÉS`;
            }
        }

        // Dice functionality removed

        // Toggle pillars modal
        function togglePillars() {
            if (!gameData) {
                alert("Les données du jeu ne sont pas encore chargées. Veuillez patienter.");
                return;
            }
            const pillarsModal = document.getElementById("pillarsModal");
            pillarsModal.classList.add("active");
            pillarsModal.style.display = "flex";
        }

        // Close pillars modal
        function closePillarsModal() {
            const pillarsModal = document.getElementById("pillarsModal");
            pillarsModal.classList.remove("active");
            pillarsModal.style.display = "none";
        }


        // Draw event card
        function drawCard(type) {
            const messages = {
                'security': 'Vous avez tiré une carte <strong>Sécurité</strong> ! ✨ Bonus de protection !',
                'surprise': 'Vous avez tiré une carte <strong>Surprise</strong> ! 🎁 Découvrez ce qui vous attend !',
                'incident': 'Vous avez tiré une carte <strong>Incident</strong> ! ⚠️ Attention, danger !'
            };
        }

        // Initialisation
        window.addEventListener("DOMContentLoaded", () => {
            // Try to load players from localStorage
            const storedPlayers = localStorage.getItem('players');

            if (storedPlayers) {
                // Players configured from player-config.html
                players = JSON.parse(storedPlayers);

                // Initialize player data structures
                players.forEach((player) => {
                    playerQuestions[player] = {};
                    for (let i = 0; i < 5; i++) {
                        playerQuestions[player][i] = [];
                    }
                    playerKeys[player] = [];
                });

                // Initialize team keys for cooperative mode
                if (gameMode === 'cooperative') {
                    teamKeys = [];
                }

                // Skip player setup and go directly to game
                document.getElementById("playerSetup").style.display = "none";
                document.getElementById("gameContainer").style.display = "block";
                updatePlayerDisplay();


                // Music is automatically started by music-controller.js
            } else {
                // Fallback: show player setup screen (old flow)
                document.getElementById("playerSetup").style.display = "flex";

                // Add event listeners for buttons
                document.getElementById("addPlayerBtn").addEventListener("click", addPlayer);
                document.getElementById("startGameBtn").addEventListener("click", startGame);
            }
        });


        let currentPillar = 0;
        let currentQuestion = 0;
        let answered = false;
        let correctAnswersCount = 0;
        let failedPillars = {};
        let selectedQuestions = []; // Questions sélectionnées pour ce pilier
        let lastAnswerWasWrong = false; // Flag pour tracker si la dernière réponse était fausse

        // Fonction pour mélanger un tableau (Fisher-Yates shuffle)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Fonction pour sélectionner 3 questions aléatoires
        function selectRandomQuestions(pillarIndex) {
            const pillar = gameData.pillars[pillarIndex];
            const shuffled = shuffleArray(pillar.questions);
            return shuffled.slice(0, 3); // Prendre les 3 premières après mélange
        }


        let pendingMalchanceAction = null; // Store action to execute after modal closes
        let pendingChanceAction = null; // Store action to execute after modal closes

        function drawCard(type) {
            // Handle chance cards with simple fullscreen display
            if (type === "chance") {
                const cards = gameData.chances;
                const card = cards[Math.floor(Math.random() * cards.length)];

                // Set only the image
                document.getElementById("chanceImage").src = card.image;

                // No audio for chance cards (only expert text)

                // Store action to execute after modal closes
                pendingChanceAction = card.action;

                // Show fullscreen modal
                document.getElementById("chanceScreen").style.display = "flex";
                return;
            }

            // Handle malchance cards with simple fullscreen display
            if (type === "malchance") {
                const cards = gameData.malchance;
                const card = cards[Math.floor(Math.random() * cards.length)];

                // Set only the image
                document.getElementById("malchanceImage").src = card.image;

                // Play audio
                if (card.audio) {
                    playAudio(card.audio);
                }

                // Store action to execute after modal closes
                pendingMalchanceAction = card.action;

                // Show fullscreen modal
                document.getElementById("malchanceScreen").style.display = "flex";
                return;
            }

            // Map card types to data sources for other cards
            const cards =
                type === "incident"
                    ? gameData.incidents
                    : type === "security" || type === "chance"
                        ? gameData.security
                        : gameData.surprises;
            const card = cards[Math.floor(Math.random() * cards.length)];

            // Définir l'icône Material Icons selon le type
            const iconMap = {
                'security': 'favorite',
                'chance': 'favorite',
                'surprise': 'help',
                'incident': 'warning'
            };

            // Définir le titre du type selon le type
            const typeTitleMap = {
                'security': 'CASE SÉCURITÉ',
                'chance': 'CASE CHANCE',
                'surprise': 'CASE SURPRISE',
                'incident': 'CASE INCIDENT'
            };

            effectSection.style.backgroundColor = colors.bg;
            effectSection.style.outlineColor = colors.bg;
            effectSection.querySelector('.text-xl').style.color = 'secondary';
            effectSection.querySelector('.text-sm').style.color = 'secondary';

            // Appliquer les styles à la section INFO OMS
            infoSection.style.backgroundColor = 'secondary';

        // Update cooperative mode progress bar
        function updateProgress() {
            const progressBoxes = document.getElementById('progressBoxes');
            const keysProgressText = document.getElementById('keysProgress');

            if (!progressBoxes || !keysProgressText) return;

            // Update text
            keysProgressText.textContent = `${teamKeys.length}/5 CLÉS`;

            // Update visual boxes
            const boxes = progressBoxes.children;
            for (let i = 0; i < 5; i++) {
                if (i < teamKeys.length) {
                    // Key obtained - show pillar color
                    const pillarIndex = teamKeys[i];
                    boxes[i].className = `flex-1 h-3 rounded pillar-${pillarIndex + 1}`;
                } else {
                    // No key - gray
                    boxes[i].className = 'flex-1 h-3 rounded bg-gray-300';
                }
            }
        }

            // TODO: Implement player-specific progress bar update for competitive mode
            console.log('Player progress bar update needed for competitive mode');
        }

        // Show key loss notification with animation
        function showKeyLossNotification(message) {
            const notification = document.getElementById('keyLossNotification');
            const textElement = document.getElementById('keyLossText');

            textElement.textContent = message;
            notification.classList.add('show');

            // Remove the class after animation completes
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2500);
        }

            const malchanceScreen = document.getElementById("malchanceScreen");

        function startPillarQuiz(pillarIndex) {
            currentPillar = pillarIndex;
            currentQuestion = 0;
            correctAnswersCount = 0;
            answered = false;
            lastAnswerWasWrong = false; // Réinitialiser le flag

            // Sélectionner 3 questions aléatoires parmi les 5
            selectedQuestions = selectRandomQuestions(pillarIndex);

            // Définir la couleur de bordure du quiz selon le pilier
            const pillarColors = ['#8BDFE7', '#8DC947', '#FFD04C', '#FFA1C8', '#FF6459'];
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.style.borderColor = pillarColors[pillarIndex];

            closePillarsModal();
            displayQuestion();
        }

        function displayQuestion() {
            const pillar = gameData.pillars[currentPillar];
            const question = selectedQuestions[currentQuestion]; // Utiliser les questions sélectionnées

            document.getElementById("quizIcon").textContent = pillar.icon;
            document.getElementById("quizPillarTitle").textContent = pillar.title;
            document.getElementById("quizProgress").textContent = `Question ${currentQuestion + 1}/3 | ✅ ${correctAnswersCount}/3`;
            document.getElementById("questionText").textContent = question.q;

            const container = document.getElementById("answersContainer");
            container.innerHTML = "";
            question.a.forEach((answer, index) => {
                const div = document.createElement("div");
                div.className = "answer-option";
                div.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${answer}`;
                div.onclick = () => selectAnswer(index);
                container.appendChild(div);
            });

            document.getElementById("explanationBox").classList.remove("active");
            document.getElementById("explanationBox").style.display = "none";
            document.getElementById("quizQueenReaction").style.display = "none";
            document.getElementById("nextQuestionBtn").style.display = "none"; // Cacher le bouton
            document.getElementById("quizScreen").classList.add("active");
            document.getElementById("quizScreen").style.display = "flex";
            answered = false;
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const pillar = gameData.pillars[currentPillar];
            const question = selectedQuestions[currentQuestion]; // Utiliser les questions sélectionnées
            const isCorrect = selectedIndex === question.correct;
            const pillarColors = ['#8BDFE7', '#8DC947', '#FFD04C', '#FFA1C8', '#FF6459'];

            const options = document.querySelectorAll(".answer-option");
            options.forEach((option, index) => {
                if (index === question.correct) {
                    option.classList.add("correct");
                    option.style.backgroundColor = pillarColors[currentPillar];
                    option.style.borderColor = pillarColors[currentPillar];
                    option.style.color = "secondary";
                }
                else if (index === selectedIndex && !isCorrect) {
                    option.classList.add("incorrect");
                    option.style.backgroundColor = "#f8d7da";
                    option.style.borderColor = "#dc3545";
                }
                option.style.pointerEvents = "none";
            });

            document.getElementById("explanationText").innerHTML =
                `<strong>💡 EXPLICATION</strong><br><br>${question.explanation}<br><br><strong>💡 OMS:</strong> ${question.fact}`;
            document.getElementById("explanationBox").style.display = "block";

            const reaction = document.getElementById("quizQueenReaction");
            reaction.style.display = "block";
            reaction.style.backgroundColor = pillarColors[currentPillar];

            if (isCorrect) {
                correctAnswersCount++;
                reaction.innerHTML = `BONNE RÉPONSE ! 😤 Plus que ${3 - correctAnswersCount} !`;
                const nextBtn = document.getElementById("nextQuestionBtn");
                if (correctAnswersCount === 3) {
                    // Afficher le bouton pour récupérer la clé
                    nextBtn.textContent = "Récupérer ma clé ! 🔑";
                    nextBtn.style.display = "block";
                } else {
                    // Afficher le bouton pour passer à la question suivante
                    nextBtn.textContent = "Question suivante";
                    nextBtn.style.display = "block";
                }
            } else {
                // Jouer l'audio d'erreur pour mauvaise réponse
                const errorAudios = ['audio/erreur/erreur-1.mp3', 'audio/erreur/erreur-2.mp3', 'audio/erreur/erreur-3.mp3'];
                const randomErrorAudio = errorAudios[Math.floor(Math.random() * errorAudios.length)];
                playAudio(randomErrorAudio);

                lastAnswerWasWrong = true; // Marquer que la réponse était fausse
                reaction.innerHTML = `MOUAHAHAHA ! MAUVAISE RÉPONSE ! 😈`;
                // Afficher le bouton pour continuer vers l'écran d'échec
                const nextBtn = document.getElementById("nextQuestionBtn");
                nextBtn.textContent = "Continuer";
                nextBtn.style.display = "block";
            }
        }

        // Nouvelle fonction pour gérer le passage à la question suivante
        function nextQuestion() {
            const nextBtn = document.getElementById("nextQuestionBtn");
            nextBtn.style.display = "none";

            if (correctAnswersCount === 3) {
                // Afficher l'écran de victoire
                showVictory();
            } else if (lastAnswerWasWrong) {
                // Si la dernière réponse était incorrecte, transformer la modal en écran d'échec
                showFailure(currentPillar);
                lastAnswerWasWrong = false; // Réinitialiser le flag
            } else {
                // Passer à la question suivante
                currentQuestion++;
                displayQuestion();
            }
        }

        function showVictory() {
            stopAudio(); // Arrêter l'audio
            document.getElementById("quizScreen").classList.remove("active");
            document.getElementById("quizScreen").style.display = "none";

            const currentPlayer = players[currentPlayerIndex];
            const pillar = gameData.pillars[currentPillar];

            if (gameMode === 'cooperative') {
                // In cooperative mode, add key to team keys
                if (!teamKeys.includes(currentPillar)) {
                    teamKeys.push(currentPillar);
                }
                // Also add to player for tracking who got which key
                if (!playerKeys[currentPlayer].includes(currentPillar)) {
                    playerKeys[currentPlayer].push(currentPillar);
                }

                updatePlayerProgressBar();

                // Check for team victory
                if (teamKeys.length >= 5) {
                    showFinalVictory();
                } else {
                    nextPlayer();
                }
            } else {
                // In competitive mode, add key only to current player
                if (!playerKeys[currentPlayer].includes(currentPillar)) {
                    playerKeys[currentPlayer].push(currentPillar);
                }

                updatePlayerProgressBar();

                // Check for individual victory
                if (playerKeys[currentPlayer].length >= 5) {
                    showFinalVictory();
                } else {
                    nextPlayer();
                }
            }
        }

        // Fonction pour mettre à jour la barre de progression du joueur actuel
        function updatePlayerProgressBar() {
            const currentPlayer = players[currentPlayerIndex];
            const pillarColors = ['#8BDFE7', '#8DC947', '#FFD04C', '#FFA1C8', '#FF6459'];
            const progressBoxes = document.querySelectorAll('#progressBoxes > div');

            let displayKeys = [];
            let keyCount = 0;

            if (gameMode === 'cooperative') {
                // In cooperative mode, show team keys
                displayKeys = teamKeys || [];
                keyCount = displayKeys.length;
            } else {
                // In competitive mode, show current player's keys
                displayKeys = playerKeys[currentPlayer] || [];
                keyCount = displayKeys.length;
            }

            // Réinitialiser toutes les cases en gris
            progressBoxes.forEach(box => {
                box.style.backgroundColor = '';
                box.classList.add('bg-gray-300');
                box.innerHTML = ''; // Vider le contenu
            });

            // Colorer les cases selon les clés gagnées
            displayKeys.forEach((pillarIndex, index) => {
                if (progressBoxes[index]) {
                    progressBoxes[index].classList.remove('bg-gray-300');
                    progressBoxes[index].style.backgroundColor = pillarColors[pillarIndex];

                    // Ajouter bouton de suppression en mode admin (FONCTIONNALITÉ SUPPRIMÉE)
                }
            });

            // Mettre à jour le compteur de clés
            if (gameMode === 'cooperative') {
                document.getElementById('keysProgress').textContent = `${keyCount}/5 CLÉS (ÉQUIPE)`;
            } else {
                document.getElementById('keysProgress').textContent = `${keyCount}/5 CLÉS (${currentPlayer})`;
            }
        }

        function showFailure(pillarIndex) {
            // Jouer l'audio d'échec du pilier
            const failureAudio = `audio/echec-cle/echec-cle-${pillarIndex + 1}.mp3`;
            playAudio(failureAudio);

            // Transformer la modal de quiz en modal d'échec
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.style.backgroundColor = '#E85D4A';
            quizContainer.style.borderColor = '#E85D4A';

            // Cacher le contenu du quiz et afficher le contenu d'échec
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('failureContent').style.display = 'flex';
        }

        function closeQuiz() {
            stopAudio(); // Arrêter l'audio

            const quizContainer = document.getElementById('quizContainer');
            quizContainer.style.backgroundColor = '#FFFFFF';

            // Afficher le contenu du quiz et cacher le contenu d'échec
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('failureContent').style.display = 'none';

            // Fermer la modal
            document.getElementById("quizScreen").classList.remove("active");
            document.getElementById("quizScreen").style.display = "none";
        }
        // Toggle Settings Modal
        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        // Confirm game reset
        function confirmReset() {
            if (confirm("Voulez-vous vraiment recommencer la partie ? Toutes les clés et la progression seront perdues.")) {
                localStorage.removeItem('currentPlayerIndex');
                localStorage.removeItem('playerKeys');
                localStorage.removeItem('teamKeys');
                localStorage.removeItem('quizResult');
                window.location.href = 'index.html';
            }
        }

        // Toggle sound
        function toggleSound() {
            // Use global music controller
            if (window.MusicController) {
                window.MusicController.toggleMute();
                isMusicMuted = window.MusicController.isMuted();
            }
            updateSoundUI();
        }

        function updateSoundUI() {
            const soundIcon = document.getElementById('soundIcon');
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            if (isMusicMuted) {
                soundIcon.textContent = 'volume_off';
                soundToggleBtn.classList.add('bg-gray-100');
            } else {
                soundIcon.textContent = 'volume_up';
                soundToggleBtn.classList.remove('bg-gray-100');
            }
        }

        // Initial sound state
        const savedMute = localStorage.getItem('isMusicMuted');
        if (savedMute !== null) {
            isMusicMuted = (savedMute === 'true');
        }

        // Show final victory screen
        function showFinalVictory() {
            stopAudio();
            // Pause music using global controller
            if (window.MusicController) {
                window.MusicController.pause();
            }
            document.getElementById('finalVictoryScreen').classList.remove('hidden');
        }

        // Reset game and go to home
        function resetGame() {
            // Optionnel: Clear localStorage if needed to restart fresh
            // localStorage.clear(); 
            window.location.href = 'index.html';
        }
    </script>
