<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panique dans la Cuisine - OMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#272727',
                        secondary: '#F8F7F1',
                        bacteria: '#423567',
                        'pillar-1': '#8BDFE7',
                        'pillar-2': '#8DC947',
                        'pillar-3': '#FFD04C',
                        'pillar-4': '#FFA1C8',
                        'pillar-5': '#FF6459',
                    },
                    fontFamily: {
                        'staatliches': ['Staatliches', 'cursive'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&family=Staatliches&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #F8F7F1;
            background-image: url('bg-start.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        .decorative-key {
            position: absolute;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        .key-1 {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .key-2 {
            top: 15%;
            right: 8%;
            animation-delay: 0.5s;
        }

        .key-3 {
            bottom: 25%;
            left: 10%;
            animation-delay: 1s;
        }

        .key-4 {
            bottom: 20%;
            right: 5%;
            animation-delay: 1.5s;
        }

        .key-5 {
            top: 50%;
            left: 2%;
            animation-delay: 2s;
        }

        .veggie {
            position: absolute;
            animation: wiggle 4s ease-in-out infinite;
        }

        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }
        }

        .veggie-1 {
            top: 20%;
            left: 15%;
            animation-delay: 0s;
        }

        .veggie-2 {
            top: 60%;
            right: 15%;
            animation-delay: 1s;
        }

        .veggie-3 {
            bottom: 15%;
            left: 20%;
            animation-delay: 2s;
        }

        /* Video Intro Overlay */
        #videoIntroOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #videoIntroOverlay.active {
            display: flex;
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(90deg) scale(1.5);
        }

        #skipIntroBtn {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            background-color: rgba(39, 39, 39, 0.8);
            color: #F8F7F1;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid #F8F7F1;
            transition: all 0.3s ease;
            transform: rotate(90deg);
        }

        #skipIntroBtn:hover {
            background-color: rgba(39, 39, 39, 1);
            transform: scale(1.05);
        }

        #skipIntroBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Video Intro Overlay -->
    <div id="videoIntroOverlay">
        <video id="introVideo" muted>
            <source src="video-intro.mp4" type="video/mp4">
            Votre navigateur ne supporte pas la vidéo.
        </video>
        <button id="skipIntroBtn">Passer l'intro</button>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 max-w-md w-full text-center">

        <!-- Logo OMS-->
        <div class="mt-6">
            <img src="logo-uxd2.png" alt="Logo OMS" class="mx-auto h-[12rem]">
        </div>

        <!-- Subtitle -->
        <p class="font-poppins text-base text-xl font-semibold text-primary py-8 px-4">
            Qui osera défier la reines des micro-organismes ?
        </p>

        <!-- CTA Button -->
        <button id="startGameBtn"
            class="bg-primary text-secondary font-inter font-semibold text-xl py-4 px-8 rounded-xl transition-all hover:opacity-90 hover:scale-105 active:scale-95">
            Lancer une partie !
        </button>


    </div>

    <!-- Global Music Controller -->
    <script src="music-controller.js"></script>

    <!-- Video Intro Script -->
    <script>
        const startGameBtn = document.getElementById('startGameBtn');
        const videoIntroOverlay = document.getElementById('videoIntroOverlay');
        const introVideo = document.getElementById('introVideo');
        const skipIntroBtn = document.getElementById('skipIntroBtn');

        function goToModeSelection() {
            window.location.href = 'mode-selection.html';
        }

        // Show video when start button is clicked
        startGameBtn.addEventListener('click', () => {
            videoIntroOverlay.classList.add('active');
            introVideo.muted = false; // Unmute the video

            // Pause background music during video
            if (window.MusicController) {
                window.MusicController.pause();
            }

            introVideo.play();
        });

        // Skip intro button
        skipIntroBtn.addEventListener('click', () => {
            // Resume background music when skipping
            if (window.MusicController && !window.MusicController.isMuted()) {
                window.MusicController.play();
            }
            goToModeSelection();
        });

        // Auto-redirect when video ends
        introVideo.addEventListener('ended', () => {
            // Resume background music when video ends
            if (window.MusicController && !window.MusicController.isMuted()) {
                window.MusicController.play();
            }
            goToModeSelection();
        });
    </script>

</body>

</html>
