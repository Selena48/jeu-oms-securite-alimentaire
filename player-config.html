<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration des joueurs - Panique dans la Cuisine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#272727',
                        secondary: '#F8F7F1',
                        bacteria: '#423567',
                        'pillar-1': '#8BDFE7',
                        'pillar-2': '#8DC947',
                        'pillar-3': '#FFD04C',
                        'pillar-4': '#FFA1C8',
                        'pillar-5': '#FF6459',
                    },
                    fontFamily: {
                        'staatliches': ['Staatliches', 'cursive'],
                        'poppins': ['Poppins', 'sans-serif'],
                        'poppins': ['poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=poppins:wght@400;500;600;700;800&family=Poppins:wght@400;600;700&family=Staatliches&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        body {
            background-color: #F8F7F1;
            background-image: url('bg-config.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-8 relative overflow-hidden">

    <!-- Main content -->
    <div class="w-full max-w-sm mx-auto relative z-10 flex flex-col gap-4 ">

        <!-- Logo OMS-->
        <div class="mt-6">
            <img src="logo-uxd2.png" alt="Logo OMS" class="mx-auto h-[12rem]">
        </div>

        <!-- Mode header with back button -->
        <div id="modeHeader" class="rounded-xl p-4 flex items-center gap-2">
            <!-- Back button -->
            <button onclick="goBack()" class="hover:opacity-80 transition-opacity" id="backButton">
                <span class="material-symbols-rounded" style="font-size: 24px;">
                    arrow_back
                </span>
            </button>

            <!-- Title and icon -->
            <div class="flex-1 flex items-center justify-center gap-2">
                <h1 class="font-staatliches text-xl uppercase tracking-wide" id="modeTitle">
                    MODE COMPÉTITIF
                </h1>
                <img src="competitif.png" alt="Clé" class="w-12">
            </div>

            <!-- Spacer for centering -->
            <div class="w-6"></div>
        </div>

        <!-- Configuration card -->
        <div class="bg-secondary rounded-xl border-2 border-primary p-4">

            <!-- Subtitle -->
            <p class="font-poppins text-lg font-semibold text-primary mb-6">
                Configurez vos joueurs.
            </p>

            <!-- Player inputs container -->
            <div class="space-y-4 mb-6" id="playerInputs">
                <!-- Player 1 -->
                <div>
                    <label class="block font-staatliches text-base text-primary mb-1 uppercase tracking-wide">
                        Joueur 1
                    </label>
                    <input type="text"
                        class="w-full px-2 py-2 border-2 border-gray-300 rounded-lg font-poppins text-base text-primary placeholder-gray-400 focus:outline-none focus:border-primary transition-colors"
                        placeholder="Nom" maxlength="15" data-player="1">
                </div>

                <!-- Player 2 -->
                <div>
                    <label class="block font-staatliches text-base text-primary mb-1 uppercase tracking-wide">
                        Joueur 2
                    </label>
                    <input type="text"
                        class="w-full px-2 py-2 border-2 border-gray-300 rounded-lg font-poppins text-base text-primary placeholder-gray-400 focus:outline-none focus:border-primary transition-colors"
                        placeholder="Nom" maxlength="15" data-player="2">
                </div>
            </div>

            <!-- Buttons row -->
            <div class="flex gap-3">
                <!-- Add player button -->
                <button id="addPlayerBtn" onclick="addPlayer()"
                    class="flex-1 p-3 border-2 border-primary bg-secondary text-primary font-poppins font-semibold text-base rounded-lg transition-all hover:bg-gray-50 active:scale-95">
                    + Ajouter un joueur
                </button>

                <!-- Play button -->
                <button onclick="startGame()"
                    class="p-3 bg-primary text-secondary font-poppins font-semibold text-base rounded-lg transition-all hover:opacity-90 active:scale-95">
                    Jouer !
                </button>
            </div>

        </div>
    </div>

    <!-- Global Music Controller -->
    <script src="music-controller.js"></script>

    <script>
        // Get game mode from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const gameMode = urlParams.get('mode') || 'cooperative';

        // Update title and colors based on mode
        const modeTitle = document.getElementById('modeTitle');
        const modeHeader = document.getElementById('modeHeader');
        const backButton = document.getElementById('backButton');
        const modeIcon = document.querySelector('#modeHeader img');

        if (gameMode === 'cooperative') {
            // Coopératif: header noir (primary)
            modeTitle.textContent = 'MODE COOPÉRATIF';
            modeHeader.classList.add('bg-primary');
            modeTitle.classList.add('text-secondary');
            backButton.classList.add('text-secondary');
            modeIcon.src = 'cooperatif.png';
        } else {
            // Compétitif: header beige (secondary)
            modeTitle.textContent = 'MODE COMPÉTITIF';
            modeHeader.classList.add('bg-secondary', 'border-2', 'border-primary');
            modeTitle.classList.add('text-primary');
            backButton.classList.add('text-primary');
            modeIcon.src = 'competitif.png';
        }

        let playerCount = 2;

        function addPlayer() {
            if (playerCount >= 4) {
                alert('Maximum 4 joueurs autorisés !');
                return;
            }

            playerCount++;
            const container = document.getElementById('playerInputs');

            const playerDiv = document.createElement('div');
            playerDiv.innerHTML = `
                <label class="block font-staatliches text-base text-primary mb-1 uppercase tracking-wide">
                    Joueur ${playerCount}
                </label>
                <input type="text" 
                    class="w-full px-2 py-2 border-2 border-gray-300 rounded-lg font-poppins text-base text-primary placeholder-gray-400 focus:outline-none focus:border-primary transition-colors"
                    placeholder="Nom" 
                    maxlength="15"
                    data-player="${playerCount}">
            `;

            container.appendChild(playerDiv);

            // Disable button if max players reached
            if (playerCount >= 4) {
                const addBtn = document.getElementById('addPlayerBtn');
                addBtn.disabled = true;
                addBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function startGame() {
            const inputs = document.querySelectorAll('input[data-player]');
            const players = Array.from(inputs)
                .map(input => input.value.trim())
                .filter(name => name !== '');

            if (players.length < 2) {
                alert('Le jeu nécessite au minimum 2 joueurs !');
                return;
            }

            if (players.length > 4) {
                alert('Maximum 4 joueurs autorisés !');
                return;
            }

            // Store players in localStorage
            localStorage.setItem('players', JSON.stringify(players));
            localStorage.setItem('gameMode', gameMode);

            // Redirect to game
            window.location.href = `jeu-wireframe.html?mode=${gameMode}`;
        }

        function goBack() {
            window.location.href = 'mode-selection.html';
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                startGame();
            }
        });
    </script>

</body>

</html>
